<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boxes</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .container{
            display: flex;
            flex-direction: column;
        }
        .box{
            /* width: 150px; */
            height: 200px;
            background-color: rgb(35, 119, 147);
            margin: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            
        }
        .box1{
            background-color: rgb(109, 181, 174);
        }
        .box2{
            background-color: green;
        }
        .box3{
            background-color: rgb(212, 125, 195);
        }
        .box4{
            background-color: rgb(228, 128, 91);
        }
        .box5{
            background-color: rgb(185, 102, 110);
        }
        .hz{
            /* flex-direction: column; */
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box1 box">1</div>
        <div class="box2 box">2</div>
        <div class="box3 box">3</div>
        <div class="box4 box">4</div>
        <div class="box5 box">5</div>
        <div class="box hz">6</div>
        <div class="box hz">7</div>
    </div>
</body>
</html>
