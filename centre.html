<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f5de;
            border-radius: 10px;
        }
        .box {
            width: 260px;
            height: 350px;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            border-radius: 10px;
            font-size: 34px;
            top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">Login</div>
    </div>
</body>
</html>
