<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Ring</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            font-family: Arial, sans-serif;
        }

        .ring {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: conic-gradient(#1e90ff 0 87%, #222 87% 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ring::before {
            content: "";
            width: 135px;
            height: 135px;
            border-radius: 50%;
            background: #000;
        }

        .text {
            position: absolute;
            color: #fff;
            font-size: 28px;
            font-weight: bold;
        }

        .wrapper {
            position: relative;
            width: 180px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="ring"></div>
        <div class="text">87%</div>
    </div>
</body>
</html>
